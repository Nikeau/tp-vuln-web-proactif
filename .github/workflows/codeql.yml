name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  security-events: write
  packages: read
  contents: read

jobs:
  analyze:
    name: Analyse CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Initialisation CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analyse CodeQL
        uses: github/codeql-action/analyze@v4
